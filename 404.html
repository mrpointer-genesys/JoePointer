<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found | Joe Pointer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/bold.css?v=20261120f">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260928">
    <style>
        /* The bold design's dark hero, without the homepage's scripts. */
        .notfound {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 16px;
            background: var(--ink);
            color: var(--on-dark);
            overflow: hidden;
        }
        .notfound .sky { position: absolute; inset: 0; z-index: 0; }
        .notfound .sky img { width: 100%; height: 100%; object-fit: cover; object-position: center 35%; }
        .notfound .sky::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(7,10,24,.55) 0%, rgba(7,10,24,.8) 60%, var(--ink) 100%);
        }
        .notfound > *:not(.sky) { position: relative; z-index: 1; }
        .notfound .name { font: 600 18px var(--body); margin-bottom: 40px; }
        .notfound .name .mk { margin-left: .18em; --d: .16em; vertical-align: .12em; }
        .notfound h1 { font: 700 clamp(40px, 7vw, 72px)/1.05 var(--display); margin: 0 0 14px; }
        .notfound p { color: var(--mid); font-size: 18px; margin: 0 0 32px; }
        .notfound .btn { background: var(--gold); color: var(--ink); }
    </style>
</head>
<body>
    <main class="notfound">
        <div class="sky" aria-hidden="true"><img src="/images/hero-mountains.jpg?v=20260903" alt=""></div>
        <div class="name">Joe Pointer<span class="mk" aria-hidden="true"></span></div>
        <h1>Page not found</h1>
        <p>The page you're looking for isn't here.</p>
        <a href="/" class="btn btn-accent"><span>Go to the homepage</span></a>
    </main>
</body>
</html>
